<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title data-i18n="stats.title">Статистика — Covers</title>
  <link rel="icon" href="logo_ris_2.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="brand.css">
</head>
<body>
<header class="site-header"><div class="header-inner">
  <div class="brand-row"><img class="brand-logo" src="logo_ris_2.png" alt="RIS"><div><div class="brand-title">Covers</div><div class="brand-subtitle" data-i18n="brand.statsSubtitle">Russian International School · статистика</div></div></div>
  <div class="header-actions">
    <nav class="top-nav"><a href="/index.html" data-i18n="common.replacements">Замены</a><a href="/schedule.html" data-i18n="common.schedule">Расписание</a><a class="active" href="/stats.html" data-i18n="common.statistics">Статистика</a><a href="#" onclick="logout(); return false;" data-i18n="common.logout">Выйти</a></nav>
    <div class="lang-switch" aria-label="Language"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
  </div>
</div></header>
<main class="page">
  <div class="page-head"><div><h1 data-i18n="stats.pageTitle">Статистика замен</h1><p data-i18n="stats.pageNote">Фактически сохранённые замены за выбранный месяц.</p></div></div>
  <section class="panel">
    <div class="panel-body">
      <div class="stats-controls">
        <div class="stats-field"><label for="statsMonth" data-i18n="stats.month">Месяц</label><select id="statsMonth">
          <option value="1" data-i18n="months.1">Январь</option><option value="2" data-i18n="months.2">Февраль</option><option value="3" data-i18n="months.3">Март</option><option value="4" data-i18n="months.4">Апрель</option>
          <option value="5" data-i18n="months.5">Май</option><option value="6" data-i18n="months.6">Июнь</option><option value="7" data-i18n="months.7">Июль</option><option value="8" data-i18n="months.8">Август</option>
          <option value="9" data-i18n="months.9">Сентябрь</option><option value="10" data-i18n="months.10">Октябрь</option><option value="11" data-i18n="months.11">Ноябрь</option><option value="12" data-i18n="months.12">Декабрь</option>
        </select></div>
        <div class="stats-field"><label for="statsYear" data-i18n="stats.year">Год</label><input type="number" id="statsYear" value="2026"></div>
        <button id="loadStatsBtn" data-i18n="common.show">Показать</button>
        <button id="exportStatsBtn" class="secondary" data-i18n="common.downloadCsv">Скачать CSV</button>
      </div>
      <div id="statsResult"><p style="color:#6b7280;text-align:center;padding:28px 0" data-i18n="stats.prompt">Выберите месяц и нажмите «Показать»</p></div>
    </div>
  </section>
  <footer class="app-footer">Covers · Russian International School</footer>
</main>
<script src="i18n.js"></script><script src="common.js"></script><script src="stats.js"></script>
</body>
</html>

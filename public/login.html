<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Covers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f1f5f9;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 40px;
            padding: 2.5rem 2rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .login-card h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }
        .login-card .subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .login-card .logo-icon {
            font-size: 3rem;
            color: #3b82f6;
            margin-bottom: 0.5rem;
        }
        .login-card label {
            display: block;
            text-align: left;
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
            margin: 1rem 0 0.3rem 0;
        }
        .login-card input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 60px;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }
        .login-card input[type="password"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .login-card button {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            margin-top: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(59,130,246,0.3);
        }
        .login-card button:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        .login-card .error {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            min-height: 1.5rem;
        }
        .login-card footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-icon">
    <img src="logo_ris_2.png" alt="Covers Logo" style="max-width: 180px; height: auto; display: block; margin: 0 auto;">
</div>
    <h1>Covers</h1>
    <p class="subtitle">Вход в систему замен</p>
    <form id="loginForm">
        <label for="password"><i class="fas fa-key"></i> Пароль</label>
        <input type="password" id="password" placeholder="Введите пароль" required autofocus>
        <button type="submit"><i class="fas fa-sign-in-alt"></i> Войти</button>
        <div id="errorMessage" class="error"></div>
    </form>
    <footer>© Covers — система управления заменами</footer>
</div>
<script>
    // В login.html перед формой
(async function() {
    try {
        const res = await fetch('/api/me');
        if (res.ok) {
            const data = await res.json();
            if (data.authenticated) {
                window.location.href = '/index.html';
            }
        }
    } catch(e) {}
})();
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('errorMessage');
        errorEl.textContent = '';
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            if (res.ok) {
                // Успешный вход, перенаправляем на главную
                window.location.href = '/index.html';
            } else {
                errorEl.textContent = data.error || 'Ошибка входа';
            }
        } catch (err) {
            errorEl.textContent = 'Ошибка соединения с сервером';
        }
    });
</script>
</body>
</html>

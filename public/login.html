<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="login.title">Вход — Covers</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="brand.css">
</head>
<body class="login-page">
  <div class="login-box">
    <div class="login-lang-row"><div class="lang-switch" aria-label="Language"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div></div>
    <div class="login-brand"><img src="logo_ris_2.png" alt="RIS"><div><h1>Covers</h1><p>Russian International School</p></div></div>
    <h2 data-i18n="login.heading">Вход в систему замен</h2>
    <form id="loginForm">
      <label for="password" data-i18n="login.password">Пароль</label>
      <input type="password" id="password" data-i18n-placeholder="login.passwordPlaceholder" placeholder="Введите пароль" required autofocus>
      <button type="submit" data-i18n="login.submit">Войти</button>
      <div id="errorMessage" class="error"></div>
    </form>
    <div class="login-foot" data-i18n="login.foot">Замены учителей и кабинетов</div>
  </div>
<script src="i18n.js"></script>
<script>
(async function(){try{const res=await fetch('/api/me');if(res.ok){const data=await res.json();if(data.authenticated)window.location.href='/index.html';}}catch(e){}})();
document.getElementById('loginForm').addEventListener('submit',async(e)=>{e.preventDefault();const password=document.getElementById('password').value;const errorEl=document.getElementById('errorMessage');errorEl.textContent='';try{const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});const data=await res.json();if(res.ok){window.location.href='/index.html';}else{errorEl.textContent=data.error||t('login.error');}}catch(err){errorEl.textContent=t('login.connectionError');}});
</script>
</body>
</html>
